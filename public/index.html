<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glift - Go Board Viewer</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <h1>Glift - Демонстрация Go-доски</h1>
  
  <div class="sgf-selector">
    <select id="sgf-select">
      <option value="simple.sgf">Простая игра</option>
      <option value="complex.sgf">Игра с комментариями</option>
      <option value="joseki.sgf">Дзёсэки угла</option>
      <option value="fuseki.sgf">Фусэки (начало игры)</option>
      <option value="life_and_death.sgf">Задача жизни и смерти</option>
      <option value="handicap.sgf">Игра с форой</option>
      <option value="territory.sgf">Пример территории</option>
    </select>
  </div>
  
  <div class="container">
    <!-- Левая панель для дерева ходов -->
    <div id="move-tree-panel">
      <h3>Дерево ходов</h3>
      <div class="tree-container">
        <!-- Здесь будет дерево ходов в будущем -->
        <p>Дерево ходов будет добавлено позже</p>
      </div>
    </div>
    
    <!-- Центральная панель с доской Go -->
    <div id="glift-container"></div>
    
    <!-- Правая панель с информацией -->
    <div id="game-info-panel">
      <div class="info-section">
        <strong>Игроки:</strong>
        <div id="player-black">Черные: -</div>
        <div id="player-white">Белые: -</div>
      </div>
      <div class="info-section">
        <strong>Время:</strong>
        <div id="time-black">Черные: -</div>
        <div id="time-white">Белые: -</div>
      </div>
    </div>
  </div>
  
  <div class="controls">
    <button id="prev-button">← Назад</button>
    <button id="next-button">Вперёд →</button>
  </div>

  <!-- Подключение скриптов -->
  <script src="../compiled/glift.js"></script>
  <script src="sgf-examples.js"></script>
  <script src="scripts/app.js"></script>
</body>
</html>
